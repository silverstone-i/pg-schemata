# Publishes final releases to npm with the "latest" dist-tag.
# Triggered automatically when a semver tag (e.g. v1.2.3) is pushed.
# RC tags are excluded via a job-level condition.
#
# Prerequisites:
#   - NPM_TOKEN must be configured in the repository's GitHub Secrets

name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  publish:
    # Skip RC tags — they are handled by publish-rc.yml
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # release-on-merge.yml pushes its tag with a deploy key, which (unlike
      # GITHUB_TOKEN) triggers this workflow. By then it has already published,
      # so skip versions that are on the registry - this workflow only does
      # real work for manually pushed tags of unpublished versions.
      - name: Skip if this version is already published
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "pg-schemata@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "pg-schemata@$version is already on the registry; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.published != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.published != 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.check.outputs.published != 'true'
        run: npm run test:unit

      - name: Run linting
        if: steps.check.outputs.published != 'true'
        run: npm run lint

      - name: Build
        if: steps.check.outputs.published != 'true'
        run: npm run build

      - name: Publish to npm (latest)
        if: steps.check.outputs.published != 'true'
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
