# Releases automatically when a labeled PR merges into main.
#
# Reads the PR's release label (release:patch | release:minor | release:major),
# bumps the version on main, promotes the CHANGELOG [Unreleased] section to the
# new version, commits, tags, and publishes to npm. An unlabeled PR merges
# without releasing.
#
# This workflow publishes directly rather than relying on the tag push to
# trigger publish-release.yml: tags pushed with GITHUB_TOKEN deliberately do
# not trigger other workflows, which also means no double publish.
# publish-release.yml remains for manually pushed tags.
#
# Prerequisites:
#   - NPM_TOKEN configured in the repository's GitHub Secrets
#   - The three release:* labels created in the repository
#   - Branch protection on main must allow github-actions[bot] to push
#     (the version-bump commit lands directly on main)

name: Release on Merge

on:
  pull_request:
    types: [closed]
    branches: ['main']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Determine bump type from PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case " $LABELS " in
            *" release:major "*) type=major ;;
            *" release:minor "*) type=minor ;;
            *" release:patch "*) type=patch ;;
            *) type=none ;;
          esac
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "Release labels found: '$LABELS' -> bump: $type"

      - name: Checkout main
        if: steps.bump.outputs.type != 'none'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.bump.outputs.type != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.bump.outputs.type != 'none'
        run: npm ci

      - name: Run tests
        if: steps.bump.outputs.type != 'none'
        run: npm run test:unit

      - name: Run linting
        if: steps.bump.outputs.type != 'none'
        run: npm run lint

      - name: Bump version and promote changelog
        if: steps.bump.outputs.type != 'none'
        id: version
        run: |
          npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            sed -i "s/^## \[Unreleased\]/## [v$version] - $(date +%F)/" CHANGELOG.md
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --follow-tags

      - name: Publish to npm (latest)
        if: steps.bump.outputs.type != 'none'
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
