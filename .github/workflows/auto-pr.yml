# Opens a PR to main automatically when a working branch is pushed.
# Solo-developer flow: branch, push, and the PR is waiting for you.
#
# The PR body reminds you to add a release label before merging:
#   release:patch | release:minor | release:major
# Leave the PR unlabeled for changes that should not publish (CI, docs).

name: Auto PR

on:
  push:
    branches-ignore: ['main']

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR to main if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $GITHUB_REF_NAME"
            exit 0
          fi
          gh pr create \
            --draft \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "$(git log -1 --pretty=%s)" \
            --body "$(printf 'Automated PR for `%s`.\n\nBefore merging, add one release label to publish on merge:\n- `release:patch` — bug fixes, docs fixes, internal refactors\n- `release:minor` — new features, new exports, new optional parameters\n- `release:major` — removed/renamed exports, changed behavior\n\nLeave unlabeled for CI/docs-only changes (no version bump, no publish).' "$GITHUB_REF_NAME")"
